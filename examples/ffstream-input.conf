ports_service:
- address: tcp:0.0.0.0:1722
  service:
    management:
      protocol: "grpc"
ports_streaming:
- address: tcp:0.0.0.0:{{ firstNonEmpty .env.AVD_PORT_PUBLISHERS "1946" }}
  mode: "publishers"
  protocol_handler:
    rtmp: {}
  custom_options:
  - key: "probesize"
    value: 32768
  - key: "analyzeduration"
    value: 200000
- address: tcp:0.0.0.0:{{ firstNonEmpty .env.AVD_PORT_CONSUMERS "1945" }}
  mode: "consumers"
  protocol_handler:
    rtmp: {}
  wait_until:
    video_track_count: 1
    audio_track_count: 1
endpoints:
  pixel/dji-osmo-pocket-3-merged: {}
  pixel/dji-osmo-pocket-3-h264-aac-encoder-input:
    forwardings:
    - destination:
        local:
          route: pixel/dji-osmo-pocket-3-merged
          publish_mode: shared-takeover
      transcoding:
        input:
          video_track_configs:
          - codec_name: h264_cuvid
            resolution:
              width: 1920
              height: 1080
        output:
          video_track_configs:
          - input_track_ids:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            output_track_ids:
            - 0
            #hardware_device_type: cuda
            #hardware_device_name: cuda:1
            codec_name: h264_nvenc
            average_bit_rate: 16000000
            resolution:
              width: 1920
              height: 1080
            custom_options:
            - key: "gpu"
              value: 1
            - key: "g"
              value: 10
            - key: "gop_size"
              value: 10
            - key: "zerolatency"
              value: "1"
            - key: "tune"
              value: "ll"
            - key: "rc-lookahead"
              value: "0"
            - key: "rc"
              value: "cbr_ld_hq"
            - key: "delay"
              value: "0"
          audio_track_configs:
          - input_track_ids:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            output_track_ids:
            - 1
            codec_name: aac
            average_bit_rate: 192000
            custom_options:
            - key: "ac"
              value: "2"
  pixel/dji-osmo-pocket-3-aac-48000:
    on_publisher_removed:
      command: ["killall", "avd"]
    forwardings:
    - destination:
        local:
          route: pixel/dji-osmo-pocket-3-h264-aac-encoder-input
          publish_mode: shared-takeover
      transcoding:
        input:
          audio_track_configs:
          - codec_name: aac
            sample_rate: 48000
        output:
          video_track_configs:
          - codec_name: raw
            input_track_ids:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            output_track_ids:
            - 0
