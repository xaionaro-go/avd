syntax = "proto3";
import "imports/avpipeline/protobuf/avpipeline.proto";

option go_package = "github.com/xaionaro-go/avd/pkg/management/grpc/proto;avdmanagementgrpc";

service AvdService {
    rpc ListPublishers (ListPublishersRequest) returns (ListPublishersResponse);
    rpc ListRoutes (ListRoutesRequest) returns (ListRoutesResponse);
    rpc ListConsumers (ListConsumersRequest) returns (ListConsumersResponse);
    rpc Monitor(avpipeline.MonitorRequest) returns (stream avpipeline.MonitorEvent);
    rpc SetPrivacyBlur(SetPrivacyBlurRequest) returns (SetPrivacyBlurResponse);
    rpc GetPrivacyBlur(GetPrivacyBlurRequest) returns (GetPrivacyBlurResponse);
    rpc SetDeblemish(SetDeblemishRequest) returns (SetDeblemishResponse);
    rpc GetDeblemish(GetDeblemishRequest) returns (GetDeblemishResponse);
    rpc SetWhisper(SetWhisperRequest) returns (SetWhisperResponse);
    rpc GetWhisper(GetWhisperRequest) returns (GetWhisperResponse);
    rpc ListFilterControls(ListFilterControlsRequest) returns (ListFilterControlsResponse);
    rpc ActivateRoute(ActivateRouteRequest) returns (ActivateRouteResponse);
    rpc DeactivateRoute(DeactivateRouteRequest) returns (DeactivateRouteResponse);
}

message ListPublishersRequest {}
message ListPublishersResponse {
    repeated avpipeline.Node nodes = 1;
}

message ListRoutesRequest {}
message ListRoutesResponse {
    repeated avpipeline.Node nodes = 1;
    repeated string route_paths = 2;
}

message ListConsumersRequest {}
message ListConsumersResponse {
    repeated avpipeline.Node nodes = 1;
}

message SetPrivacyBlurRequest {
    string route_path = 1;
    int32 forwarding_index = 2;
    optional bool enabled = 3;
    optional double blur_radius = 4;
    optional int64 pixelate_block_size = 5;
}

message SetPrivacyBlurResponse {}

message GetPrivacyBlurRequest {
    string route_path = 1;
    int32 forwarding_index = 2;
}

message GetPrivacyBlurResponse {
    bool enabled = 1;
    double blur_radius = 2;
    int64 pixelate_block_size = 3;
}

message SetDeblemishRequest {
    string route_path = 1;
    int32 forwarding_index = 2;
    optional bool enabled = 3;
    optional double sigma_s = 4;
    optional double sigma_r = 5;
    optional int64 diameter = 6;
}

message SetDeblemishResponse {}

message GetDeblemishRequest {
    string route_path = 1;
    int32 forwarding_index = 2;
}

message GetDeblemishResponse {
    bool enabled = 1;
    double sigma_s = 2;
    double sigma_r = 3;
    int64 diameter = 4;
}

message SetWhisperRequest {
    string route_path = 1;
    int32 forwarding_index = 2;
    optional bool enabled = 3;
    optional string language = 4;
    optional string model = 5;
}

message SetWhisperResponse {}

message GetWhisperRequest {
    string route_path = 1;
    int32 forwarding_index = 2;
}

message GetWhisperResponse {
    bool enabled = 1;
    string language = 2;
    string model = 3;
}

message FilterControlInfo {
    string route_path = 1;
    int32 forwarding_index = 2;
    bool has_privacy_blur = 3;
    bool has_deblemish = 4;
    bool has_whisper = 5;
}

message ListFilterControlsRequest {}
message ListFilterControlsResponse {
    repeated FilterControlInfo controls = 1;
}

message ActivateRouteRequest {
    string route_path = 1;
}

message ActivateRouteResponse {}

message DeactivateRouteRequest {
    string route_path = 1;
}

message DeactivateRouteResponse {}
